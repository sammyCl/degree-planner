[project]
name = "degree-planner-backend"
version = "0.1.0"
description = "Backend API: request router, data loader, lookups, plan validator, plan store, transcript parser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypdf>=7.1.0",
    "mcp>=2.3.0",
]

[project.scripts]
load-data = "degree_planner_backend.data_loader:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/degree_planner_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
